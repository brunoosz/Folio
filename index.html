<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f4" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Folio — caderno inteligente de saúde e treino. Corpo, rotina e ciência." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Folio" />
    <title>Folio — Corpo, rotina e ciência</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // Aplica o tema salvo antes da primeira pintura (evita piscar claro no modo escuro).
      try {
        var s = (JSON.parse(localStorage.getItem('folio_settings') || '{}').state) || {};
        var t = s.tema || 'claro';
        if (t === 'sistema') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      html, body { background: #f6f5f4; margin: 0; }
      html[data-theme='escuro'], html[data-theme='escuro'] body { background: #141312; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
